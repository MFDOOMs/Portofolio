<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A "T" monogram: page stock on an inked square, flipped in dark mode so it
       stays visible against a dark browser tab strip. -->
  <style>
    .plate { fill: #000000; }
    .mark { fill: #e9e0cc; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #ece3cf; }
      .mark { fill: #12100e; }
    }
  </style>
  <rect class="plate" width="32" height="32" />
  <rect class="mark" x="6" y="6" width="20" height="5" />
  <rect class="mark" x="13.5" y="6" width="5" height="20" />
</svg>
